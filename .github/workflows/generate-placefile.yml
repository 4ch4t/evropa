name: Generate and Deploy Placefile

on:
  push:
    branches: ["main", "master"]
  schedule:
    # Запуск каждые 15 минут для актуальности радара
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run JS Generator
        # Запускает скрипт. Скрипт сам создаст папку public и положит туда placefile.txt
        run: node index.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Page Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

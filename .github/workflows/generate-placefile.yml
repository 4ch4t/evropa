name: Generate and Deploy Placefile

on:
  push:
    branches:
      - main # Запуск при пуше в ветку main (измени, если ветка называется master)
  schedule:
    - cron: '*/5 * * * *' # Автоматический запуск каждые 30 минут (опционально)
  workflow_dispatch: # Позволяет запускать процесс вручную из интерфейса GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Версия Node.js

      - name: Install dependencies
        run: npm install || true

      - name: Run generator script
        run: |
          # 1. Принудительно создаем папку, которую ищет шаг Upload Page Artifact
          mkdir -p public
          
          # 2. Запускаем твой скрипт-генератор
          node index.js
          
          # 3. Перемещаем готовый файл в папку public
          # ВАЖНО: Если твой скрипт выдает файл с другим именем (не placefile.txt), 
          # поменяй название в строке ниже!
          mv placefile.txt public/ || true

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload Page Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public' # Теперь папка существует и архивация не выдаст ошибку

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
